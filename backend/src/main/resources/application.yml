spring:
  application:
    name: servico-ja-api
  autoconfigure:
    # A autenticacao e so por JWT; sem isto o Spring cria um usuario padrao em memoria com senha no log.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servico_ja}
    username: ${DB_USER:servico_ja}
    password: ${DB_PASSWORD:servico_ja}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  # Atras de um proxy reverso/load balancer (Render, Railway, nginx...), usa o IP real do cliente
  # enviado em X-Forwarded-For, que e a base dos limites de requisicoes por IP. O Tomcat so aceita
  # esse cabecalho quando a conexao vem de um proxy interno (loopback ou rede privada), entao um
  # cliente externo nao consegue forjar o proprio IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # SMTP fora do ar (ou nao configurado) nao deve derrubar o healthcheck da aplicacao,
    # ja que o envio de e-mail e uma funcionalidade secundaria (recuperacao de senha).
    mail:
      enabled: false

servico-ja:
  jwt:
    segredo: ${JWT_SECRET:dev-segredo-servico-ja-troque-em-producao-32-bytes-min}
    expiracao-acesso-min: ${JWT_EXPIRACAO_ACESSO_MIN:60}
    expiracao-refresh-dias: ${JWT_EXPIRACAO_REFRESH_DIAS:30}
  asaas:
    url: ${ASAAS_URL:https://api-sandbox.asaas.com}
    api-key: ${ASAAS_API_KEY:}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
    valor-mensal: ${ASAAS_VALOR_MENSAL:49.90}
    valor-anual: ${ASAAS_VALOR_ANUAL:479.00}
  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    cidade-padrao: ${CIDADE_PADRAO:Marau}
    uf-padrao: ${UF_PADRAO:RS}
    # Fuso usado em regras de horario local, como "aberto agora".
    fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  upload:
    diretorio: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:admin@servicoja.com.br}
    senha: ${ADMIN_SEED_SENHA:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
